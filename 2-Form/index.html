<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<link rel="stylesheet" href="./styles.css">
	<title>Register</title>
</head>

<body>
	<main>
		<section class="dialog">
			<div class="header-block">
				<h1>Регистрация</h1>
				<p>Уже есть аккаунт?&nbsp;&nbsp;&nbsp;<a href="">Войти</a></p>
			</div>
			<form action="#" class="register-form">
				<div>
					<input type="text" id="company" name="company" placeholder="Компания" value="Мой компания">
				</div>
				<div class="first-last-name">
					<input type="text" id="first-name" name="firs-tname" placeholder="Имя" class="first-name">
					<input type="text" id="last-name" name="last-name" placeholder="Фамилия" class="last-name">
				</div>
				<div>
					<input type="email" id="email" name="email" placeholder="E-mail">
				</div>
				<div>
					<button>
						<div class="button-img-place"></div>
						<div class="button-content">Зарегистрироваться</div>
						<div class="button-img-place">
							<img src="./img/arrow.svg" alt="Go">
						</div>


					</button>
				</div>
				<div>
					<label class="custom-checkbox">
						<input type="checkbox" class="checkbox-custom" id="rules">
						Я прочитал и принимаю&nbsp;&nbsp;<a href="#">Условия пользования</a>
					</label>
				</div>
			</form>
		</section>
	</main>
</body>

</html>
